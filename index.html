      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "A/B Test Significance Calculator",
        "url": "https://ab-test-calculator.correia95.workers.dev/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "description": "Runs a two-proportion z-test on control and variant visitor/conversion counts, computing conversion rates, relative uplift, z-score, p-value, and statistical significance against a chosen threshold."
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What significance level should I use?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Alpha = 0.05 is a common default, but 0.01 is more conservative for high-stakes decisions, and 0.10 is sometimes used for quick, lower-stakes experiments."
            }
          },
          {
            "@type": "Question",
            "name": "My result isn't significant - does that mean the variant doesn't work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Not necessarily - it may mean you don't have enough data yet to detect a real but smaller effect. Consider running the test longer rather than concluding there's no effect."
            }
          },
          {
            "@type": "Question",
            "name": "Does this account for multiple testing or peeking at results early?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "No - this is a single, one-time significance test. Checking results repeatedly as data comes in inflates your real false-positive rate beyond the stated alpha."
            }
          }
        ]
      }
    </script>
